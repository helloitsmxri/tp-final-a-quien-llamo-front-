@if (rubros.length) {
  <fieldset>
    <legend>Rubros</legend>
    @for (r of rubros; track r.uuidRubro) {
      <label>
        <input type="checkbox"
               [checked]="seleccionados.has(r.uuidRubro)"
               (change)="toggle(r.uuidRubro, $any($event.target).checked)">
        {{ r.nombreRubro }}
      </label>
    }
  </fieldset>
}
