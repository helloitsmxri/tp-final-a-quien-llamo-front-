<div class="app-layout">
  <app-header-izquierdo />

  <!-- la lista trae su propio buscador y su panel -->
  <div class="columna-conversaciones">
    <app-lista-chat (chatSeleccionadoEvent)="alSeleccionarChat($event)"></app-lista-chat>
  </div>

  <!-- era <main>, pero app.html ya tiene un <main>: no puede haber dos -->
 <section class="panel-chat-activo">

    @if (chatSeleccionado) {

      <app-detalle-chat
        [chat]="chatSeleccionado"
        (mensajeNuevo)="alMensajeNuevo($event)"
      />

    } @else {

      <div class="sin-chat-seleccionado">
        <div class="sin-chat-icono">✉</div>
        <p>
          Seleccioná una conversación para comenzar a chatear.
          Acá vas a poder comunicarte con tus clientes y profesionales.
        </p>
      </div>

    }
  </section>
</div>
