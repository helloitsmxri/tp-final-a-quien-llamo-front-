<div class="inbox-container">
  <h2>Mis Conversaciones</h2>

  <div class="lista-conversaciones">
    @for (chat of chats; track chat.uuidChat) {
      <div class="item-chat" (click)="abrirChat(chat.uuidChat)">
        <div class="avatar">💬</div>
        <div class="info-chat">
          <h4>{{ chat.nombreTecnico || 'Técnico' }}</h4>
          <p class="subtexto">Toca para abrir la conversación</p>
        </div>
      </div>
    } @empty {
      <p class="sin-chats">No tenés conversaciones abiertas.</p>
    }
  </div>
</div>
