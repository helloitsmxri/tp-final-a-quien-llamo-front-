<div class="search-box">
  <input type="text" [(ngModel)]="filtroBusqueda" placeholder="Inserte un nombre aquí para buscar" />
</div>

<!-- Botón de prueba temporal para iniciar chat -->
<div style="padding: 10px; text-align: center;">
  <button type="button" (click)="iniciarChatDePrueba()">➕ Probar Nuevo Chat</button>
</div>

<div class="lista-chats">
  @for (chat of chatsFiltrados; track chat.uuidChat) {
    <div 
      class="item-chat" 
      [class.active]="chatSeleccionado?.uuidChat === chat.uuidChat"
      (click)="seleccionarChat(chat)"
    >
      <div class="avatar-chat">
        <img [src]="'https://ui-avatars.com/api/?name=' + (chat.nombreTecnico || 'Usuario')" alt="Avatar" />
      </div>
      <div class="info-chat">
        <span class="nombre">{{ chat.nombreTecnico || 'Contacto' }}</span>
      </div>
    </div>
  } @empty {
    <p class="sin-chats">No tenés conversaciones activas.</p>
  }
</div>
