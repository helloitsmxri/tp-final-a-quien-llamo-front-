
@if (cargando) {
  <p>Cargando...</p>
}

@if (error) {
  <p class="error">{{ error }}</p>
}

@if (!cargando && !error && portfolios.length > 0) {
  <ul>
    @for (p of portfolios; track p.uuid) {
      <li>
        <strong
          class="titulo"
          [class.aprobado]="p.estadoVerificacion === Estado.Aprobado"
          [class.no-aprobado]="p.estadoVerificacion !== Estado.Aprobado">
          {{ p.titulo }}
        </strong>
      </li>
    }
  </ul>
}
