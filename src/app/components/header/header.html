<!-- (mouseleave) está en TODO el header: cuando el mouse sale de la barra Y del panel, se cierra todo -->
<header class="barra" (mouseleave)="salirDelHeader($event)">
 
  <!-- aria-label es para q un lector de pantalla sepa q este es el menú principal -->
  <nav class="menu" aria-label="Principal">
 
    <!-- el logo y el nombre son UN solo link q lleva al inicio. (pointerenter)="cerrar()" es xq si paso por acá con el panel abierto, se cierra -->
    <a class="logo-link" [routerLink]="['']" (pointerenter)="cerrar()">
      <!-- alt vacío a propósito: el nombre ya está escrito al lado, sino el lector lo leería dos veces -->
      <img class="logo" alt="" src="/íconos/logo/logo.png">
      <span class="logo-nombre">¿A Quién Llamo?</span>
    </a>
 
    <ul class="opciones">
      <li (pointerenter)="cerrar()">
        <!-- routerLinkActive le pone la clase "activo" cuando estás en esa página. exact:true es xq "/" está dentro de todas las rutas, sino siempre estaría marcado -->
        <a [routerLink]="['']" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      </li>
 
      <li (pointerenter)="cerrar()">
        <a [routerLink]="['/contacto']" routerLinkActive="activo">Contacto</a>
      </li>
 
      <!-- ESTE es el q abre el panel. Con mouse se abre al pasar por encima, con el dedo se abre tocando -->
      <li class="menu-desplegable" (pointerenter)="entrar($event)">
        <!-- es un <button> y no un link xq no lleva a ningún lado, solo abre y cierra el panel.
             aria-expanded le avisa al lector si está abierto o cerrado, aria-controls dice a qué panel se refiere -->
        <button type="button"
        class="dropdown-toggle"
        [class.activo]="abierto() || enCategorias()" [attr.aria-expanded]="abierto()"
        aria-controls="menu-categorias" (click)="clic()">
          Categorías
        </button>
      </li>
    </ul>
 
    <!-- los dos botones van juntos en un div, así la barra tiene 3 zonas: logo | opciones | botones -->
    <div class="acciones">
      <a class="boton iniciar-sesion" routerLink="/iniciar-sesion" (pointerenter)="cerrar()">Iniciar sesión</a>
      <a class="boton registro" routerLink="/registrarse" (pointerenter)="cerrar()">Registrarse</a>
    </div>
 
  </nav>
 
  <!-- el panel está DENTRO del header (no del li) xq así el mouse puede bajar de la barra al panel sin q se cierre.
       @if hace q solo exista en la página cuando abierto() es true -->
  @if (abierto()) {
    <div id="menu-categorias" class="mega-panel">
      <ul class="mega-grid">
 
        <!-- @for repite una tarjeta por cada categoría del array de categorias del .ts.
             track c.ruta es para q Angular identifique cada una (tiene q ser algo único) -->
        @for (c of categorias; track c.ruta) {
 
          <!-- [style.grid-area]="c.ruta" le dice a cada tarjeta en qué lugar de la grilla va (el nombre coincide con el del CSS) -->
          <li [style.grid-area]="c.ruta">
 
            <!-- toda la tarjeta es un link, así se puede hacer clic en cualquier parte del dibujo -->
            <a class="tarjeta" [routerLink]="['/categorias', c.ruta]">
              <span class="tarjeta__nombre">{{ c.nombre }}</span>
              <!-- loading="lazy" = no descarga la imagen hasta q hace falta, así no pesa tanto en celulares -->
              <img class="tarjeta__img" [src]="c.imagen" alt="" loading="lazy">
              <!-- la flechita es solo decoración, por eso aria-hidden (el lector la ignora) -->
              <span class="tarjeta__flecha" aria-hidden="true">→</span>
            </a>
          </li>
        }
      </ul>
    </div>
  }
</header>
