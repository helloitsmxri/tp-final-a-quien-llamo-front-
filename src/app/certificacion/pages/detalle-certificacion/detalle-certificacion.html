
@if (cargando) {
  <p>Cargando...</p>
}

@if (error) {
  <p class="error">{{ error }}</p>
}

@if (!cargando && !error && certificaciones.length > 0) {
  <ul>
    @for (c of certificaciones; track c.uuid) {
      <li>
        <strong
          class="titulo"
          [class.aprobado]="c.estadoVerificacion === Estado.Aprobado"
          [class.no-aprobado]="c.estadoVerificacion !== Estado.Aprobado">
          {{ c.titulo }}
        </strong>
      </li>
    }
  </ul>
}
